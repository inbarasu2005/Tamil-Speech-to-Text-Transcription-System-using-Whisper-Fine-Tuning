{% extends 'base.html' %}

{% block title %}Login - Tamil Speech-to-Text{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="glass-card mt-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold mb-1">Welcome <span class="text-gradient">Back</span></h2>
                <p class="text-white-50 small">Log in to access the transcription dashboard</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST" id="loginForm" class="needs-validation" novalidate>
                <!-- Email Field -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group-custom">
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        <i class="bi bi-envelope-fill input-icon"></i>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group-custom">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        <i class="bi bi-lock-fill input-icon"></i>
                        <button class="password-toggle-btn" type="button" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')">
                            <i class="bi bi-eye-slash" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember" value="true">
                        <label class="form-check-label text-white-50 small" for="remember">
                            Remember me
                        </label>
                    </div>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn btn-primary-custom w-100 py-2.5 mb-3" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right"></i> Log In
                </button>

                <div class="text-center">
                    <span class="text-white-50 small">Don't have an account? </span>
                    <a href="{{ url_for('register') }}" class="text-gradient fw-semibold text-decoration-none small">Register here</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function togglePasswordVisibility(fieldId, iconId) {
        const passwordField = document.getElementById(fieldId);
        const toggleIcon = document.getElementById(iconId);
        if (passwordField.type === "password") {
            passwordField.type = "text";
            toggleIcon.classList.remove("bi-eye-slash");
            toggleIcon.classList.add("bi-eye");
        } else {
            passwordField.type = "password";
            toggleIcon.classList.remove("bi-eye");
            toggleIcon.classList.add("bi-eye-slash");
        }
    }

    // Client-side Validation styling
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
{% endblock %}
